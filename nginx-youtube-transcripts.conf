# /etc/nginx/sites-available/youtube-transcripts
#
# This config binds nginx to port 80 on the Tailscale interface only.
# Nothing is exposed on the public IP — only reachable inside your Tailscale mesh.
#
# To find your Tailscale IP on the Linode box:   tailscale ip -4
# Replace 100.x.x.x below with that address.

server {
    # IMPORTANT: Replace 100.x.x.x with your actual Tailscale IP
    listen 100.x.x.x:80;
    server_name 100.x.x.x;

    # Limit request body size — transcripts are tiny, protect against abuse
    client_max_body_size 1m;

    # Proxy all traffic to the gunicorn process on localhost
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # yt-dlp can take up to ~30s on slow connections — don't time out too early
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    # Serve transcript .txt files directly from disk — slightly faster than proxying
    location /transcripts/ {
        alias /opt/youtube-transcripts/transcripts/;
        add_header Content-Type "text/plain; charset=utf-8";
        # Force download instead of rendering in browser
        add_header Content-Disposition "attachment";
    }

    # Silence the favicon 404 that browsers always request
    location = /favicon.ico {
        return 204;
        access_log off;
    }

    access_log /var/log/nginx/ytscripts_access.log;
    error_log  /var/log/nginx/ytscripts_error.log;
}
